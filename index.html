<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Etiquetas para simular App nativa en pantalla completa -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>On Fire Padel - Score App Ultra</title>
    <style>
        :root {
            --primary: #ff4500; /* Naranja On Fire */
            --dark: #0f0f11;
            --card: #16161a;
            --card-active: #22222a;
            --text: #ffffff;
            --muted: #8e8e93;
            --input-bg: #24242b;
            --neon-glow: 0 0 20px rgba(255, 69, 0, 0.7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 5px;
            width: 100%;
        }

        h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .panel {
            background-color: var(--card);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
            border: 1px solid #252525;
        }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px 14px;
            border-radius: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        .players-setup {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .team-inputs {
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .team-inputs label {
            display: block;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .sets-display {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 600;
            background: #16161a;
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid #222;
        }

        /* DISEÑO DE CONTENEDOR EN HORIZONTAL */
        .layout-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            flex: 1;
            padding: 5px 0;
        }

        /* Nombres en los laterales */
        .lateral-team-info {
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(22, 22, 26, 0.4);
            padding: 15px 10px;
            border-radius: 14px;
            border: 1px solid #1f1f24;
            transition: color 0.2s, border-color 0.2s;
        }

        .lateral-team-info.serving-active {
            border-color: var(--primary);
        }

        .team-name-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--muted);
            text-align: center;
            line-height: 1.3;
        }

        .serving-active .team-name-title {
            color: #fff;
        }

        .ball-icon-label {
            font-size: 0.85rem;
            color: var(--muted);
            opacity: 0.2;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .serving-active .ball-icon-label {
            color: var(--primary);
            opacity: 1;
            animation: pulse 1.5s infinite;
        }

        /* Los Marcadores del Centro */
        .score-container {
            display: flex;
            gap: 15px;
            flex: 1;
            max-width: 500px;
            height: 100%;
            max-height: 240px; /* Evita que queden demasiado altos */
            align-items: center;
        }

        .team-box {
            flex: 1;
            height: 100%;
            background-color: var(--card);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #222;
            cursor: pointer;
            transition: transform 0.05s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        .team-box:active {
            transform: scale(0.96);
            background-color: var(--card-active);
        }

        .team-box.serving {
            border-color: var(--primary);
            box-shadow: var(--neon-glow);
        }

        .games-badge {
            background: #25252b;
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 800;
            border: 1px solid #333;
            margin-bottom: 10px;
        }
        
        .serving .games-badge {
            background: var(--primary);
            border-color: var(--primary);
        }

        .team-score {
            font-size: 6.5rem; /* ¡Mucho más grande! */
            font-weight: 900;
            color: #fff;
            line-height: 0.9;
        }

        .team-footer {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 8px;
            background: rgba(0,0,0,0.2);
            padding: 1px 8px;
            border-radius: 6px;
        }

        /* Controles Inferiores */
        .controls {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 650px;
            margin-top: 5px;
        }

        .btn {
            flex: 1;
            background-color: #16161a;
            color: #fff;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:active { background-color: #2c2c35; }
        .btn-primary { background-color: var(--primary); border: none; font-weight: 700;}
        .btn-reset { color: #ff3b30; }

        /* Banner de Aviso flotante */
        .alert-banner {
            position: fixed;
            top: 15px;
            background: var(--primary);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .hidden { display: none !important; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Score Padel</h1>
    </header>

    <!-- CONFIGURACIÓN -->
    <div id="setup-screen" class="panel">
        <div class="toggle-container">
            <div>
                <strong id="mode-text">Punto de Oro Activo</strong>
                <div style="font-size: 0.75rem; color: var(--muted);">Reglas para el deuce (40-40)</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="rule-mode" checked onchange="toggleRuleMode()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="players-setup">
            <div class="team-inputs">
                <label>PAREJA A</label>
                <div class="input-group">
                    <input type="text" id="pA1" value="Jugador 1">
                    <input type="text" id="pA2" value="Jugador 2">
                </div>
            </div>
            <div class="team-inputs">
                <label>PAREJA B</label>
                <div class="input-group">
                    <input type="text" id="pB1" value="Jugador 3">
                    <input type="text" id="pB2" value="Jugador 4">
                </div>
            </div>
            <button class="btn btn-primary" onclick="startGame()">Iniciar Partido</button>
        </div>
    </div>

    <!-- TABLERO DE JUEGO ULTRA LIMPIO -->
    <div id="game-screen" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center; flex: 1;">
        <div class="sets-display" id="sets-history">Set Actual: 0-0</div>

        <!-- CONTENEDOR DE FILA (Nombres lados | Marcadores centro) -->
        <div class="layout-container">
            
            <!-- Lateral Izquierdo: Pareja A -->
            <div class="lateral-team-info serving-active" id="lateral-A">
                <div class="ball-icon-label" onclick="switchServer('A')">🎾 SAQUE</div>
                <div class="team-name-title" id="lbl-A1">Jugador 1</div>
                <div class="team-name-title" id="lbl-A2" style="font-size:0.8rem; opacity:0.6;">Jugador 2</div>
            </div>

            <!-- Centro: Marcadores táctiles gigantes -->
            <div class="score-container">
                <div class="team-box serving" id="box-A" onclick="scorePoint('A')">
                    <div class="games-badge" id="games-A">0</div>
                    <div class="team-score" id="score-A">0</div>
                    <div class="team-footer">Sets: <span id="sets-A">0</span></div>
                </div>

                <div class="team-box" id="box-B" onclick="scorePoint('B')">
                    <div class="games-badge" id="games-B">0</div>
                    <div class="team-score" id="score-B">0</div>
                    <div class="team-footer">Sets: <span id="sets-B">0</span></div>
                </div>
            </div>

            <!-- Lateral Derecho: Pareja B -->
            <div class="lateral-team-info" id="lateral-B">
                <div class="ball-icon-label" onclick="switchServer('B')">🎾 SAQUE</div>
                <div class="team-name-title" id="lbl-B1">Jugador 3</div>
                <div class="team-name-title" id="lbl-B2" style="font-size:0.8rem; opacity:0.6;">Jugador 4</div>
            </div>

        </div>

        <!-- Controles de Navegación -->
        <div class="controls">
            <button class="btn" onclick="undo()">↩ Deshacer</button>
            <button class="btn" onclick="toggleFullscreen()">📺 Pantalla Completa</button>
            <button class="btn" onclick="editPlayers()">✏️ Nombres</button>
            <button class="btn btn-reset" onclick="resetMatch()">🔄 Reiniciar</button>
        </div>
    </div>

    <div id="alert-box" class="alert-banner hidden">¡Cambio de lado!</div>

    <script>
        let pointsA = 0, pointsB = 0;
        let gamesA = 0, gamesB = 0;
        let setsA = 0, setsB = 0;
        let setHistory = [];
        
        let advantage = null; 
        let isGoldenPoint = true;
        let currentServer = 'A';
        let historyStack = [];
        let isTieBreak = false;

        let pA1_name = "J1", pA2_name = "J2", pB1_name = "J3", pB2_name = "J4";
        const pointsMap = { 0: "0", 1: "15", 2: "30", 3: "40" };

        function toggleRuleMode() {
            isGoldenPoint = document.getElementById('rule-mode').checked;
            document.getElementById('mode-text').innerText = isGoldenPoint ? "Punto de Oro Activo" : "Ventaja Normal Activa";
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`No se pudo activar pantalla completa: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function startGame() {
            pA1_name = document.getElementById('pA1').value.trim() || "J1";
            pA2_name = document.getElementById('pA2').value.trim() || "J2";
            pB1_name = document.getElementById('pB1').value.trim() || "J3";
            pB2_name = document.getElementById('pB2').value.trim() || "J4";

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            updateUI();
        }

        function editPlayers() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        function saveState() {
            historyStack.push(JSON.stringify({
                pointsA, pointsB, gamesA, gamesB, setsA, setsB, setHistory, advantage, currentServer, isTieBreak
            }));
        }

        function switchServer(team) {
            saveState();
            currentServer = team;
            updateUI();
        }

        function scorePoint(team) {
            saveState();
            
            if (isTieBreak) {
                if (team === 'A') pointsA++; else pointsB++;
                let totalPoints = pointsA + pointsB;
                if (totalPoints % 2 === 1) currentServer = currentServer === 'A' ? 'B' : 'A';

                if (pointsA >= 7 && pointsA - pointsB >= 2) winSet('A');
                else if (pointsB >= 7 && pointsB - pointsA >= 2) winSet('B');
                if (totalPoints % 6 === 0) triggerAlert("¡Cambio de lado!");
                
            } else {
                if (isGoldenPoint) {
                    if (pointsA === 3 && pointsB === 3) {
                        team === 'A' ? winGame('A') : winGame('B');
                    } else {
                        if (team === 'A') pointsA++; else pointsB++;
                        if (pointsA > 3) winGame('A');
                        else if (pointsB > 3) winGame('B');
                    }
                } else {
                    if (pointsA === 3 && pointsB === 3) {
                        if (!advantage) advantage = team;
                        else if (advantage === team) winGame(team);
                        else advantage = null; 
                    } else {
                        if (team === 'A') pointsA++; else pointsB++;
                        if (pointsA > 3 && pointsB < 3) winGame('A');
                        else if (pointsB > 3 && pointsA < 3) winGame('B');
                        else if (pointsA === 3 && pointsB === 3) advantage = null;
                    }
                }
            }
            updateUI();
        }

        function winGame(team) {
            pointsA = 0; pointsB = 0; advantage = null;
            if (team === 'A') gamesA++; else gamesB++;
            
            if (gamesA === 6 && gamesB === 6) {
                isTieBreak = true;
                triggerAlert("¡TIE-BREAK!");
            } else {
                if (gamesA >= 6 && gamesA - gamesB >= 2) winSet('A');
                else if (gamesB >= 6 && gamesB - gamesA >= 2) winSet('B');
            }

            if (!isTieBreak && (gamesA + gamesB) % 2 === 1) triggerAlert("¡Cambio de lado!");
            if (!isTieBreak) currentServer = currentServer === 'A' ? 'B' : 'A';
        }

        function winSet(team) {
            if (team === 'A') setsA++; else setsB++;
            setHistory.push(`${gamesA}-${gamesB}`);
            gamesA = 0; gamesB = 0; pointsA = 0; pointsB = 0; isTieBreak = false;
        }

        function triggerAlert(msg) {
            const banner = document.getElementById('alert-box');
            banner.innerText = msg;
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.add('hidden'), 2200);
        }

        function undo() {
            if (historyStack.length > 0) {
                const prev = JSON.parse(historyStack.pop());
                pointsA = prev.pointsA; pointsB = prev.pointsB;
                gamesA = prev.gamesA; gamesB = prev.gamesB;
                setsA = prev.setsA; setsB = prev.setsB;
                setHistory = prev.setHistory; advantage = prev.advantage;
                currentServer = prev.currentServer; isTieBreak = prev.isTieBreak;
                updateUI();
            }
        }

        function resetMatch() {
            if(confirm("¿Reiniciar el partido entero?")) {
                pointsA = 0; pointsB = 0; gamesA = 0; gamesB = 0; setsA = 0; setsB = 0;
                setHistory = []; advantage = null; historyStack = []; currentServer = 'A'; isTieBreak = false;
                updateUI();
            }
        }

        function updateUI() {
            if (isTieBreak) {
                document.getElementById('score-A').innerText = pointsA;
                document.getElementById('score-B').innerText = pointsB;
            } else if (!isGoldenPoint && pointsA === 3 && pointsB === 3) {
                if (!advantage) {
                    document.getElementById('score-A').innerText = "40";
                    document.getElementById('score-B').innerText = "40";
                } else {
                    document.getElementById('score-A').innerText = advantage === 'A' ? "V" : "-";
                    document.getElementById('score-B').innerText = advantage === 'B' ? "V" : "-";
                }
            } else {
                document.getElementById('score-A').innerText = pointsMap[pointsA] || "40";
                document.getElementById('score-B').innerText = pointsMap[pointsB] || "40";
            }

            // Nombres en las cajas laterales
            document.getElementById('lbl-A1').innerText = pA1_name;
            document.getElementById('lbl-A2').innerText = `& ${pA2_name}`;
            document.getElementById('lbl-B1').innerText = pB1_name;
            document.getElementById('lbl-B2').innerText = `& ${pB2_name}`;

            document.getElementById('games-A').innerText = `Juegos: ${gamesA}`;
            document.getElementById('games-B').innerText = `Juegos: ${gamesB}`;
            document.getElementById('sets-A').innerText = setsA;
            document.getElementById('sets-B').innerText = setsB;

            let historyText = isTieBreak ? "Set Actual: TIE-BREAK" : `Set Actual: ${gamesA}-${gamesB}`;
            if (setHistory.length > 0) {
                document.getElementById('sets-history').innerText = `Sets: ${setHistory.join(' / ')} | ${historyText}`;
            } else {
                document.getElementById('sets-history').innerText = historyText;
            }

            // Clases de Servicio para Neon en los Marcadores
            document.getElementById('box-A').classList.remove('serving');
            document.getElementById('box-B').classList.remove('serving');
            document.getElementById('lateral-A').classList.remove('serving-active');
            document.getElementById('lateral-B').classList.remove('serving-active');
            
            if (currentServer === 'A') {
                document.getElementById('box-A').classList.add('serving');
                document.getElementById('lateral-A').classList.add('serving-active');
            } else {
                document.getElementById('box-B').classList.add('serving');
                document.getElementById('lateral-B').classList.add('serving-active');
            }
        }
    </script>
</body>
</html>
